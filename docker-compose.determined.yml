services:
  determined-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: determined
      POSTGRES_PASSWORD: determined
      POSTGRES_DB: determined
    ports:
      - "5433:5432"
    volumes:
      - determined_postgres_data:/var/lib/postgresql/data

  determined-master:
    image: determinedai/determined-master:0.35.0
    restart: unless-stopped
    depends_on:
      - determined-db
    ports:
      - "8080:8080"
    volumes:
      - ./infra/determined/master.yaml:/etc/determined/master.yaml:ro
      - /mnt/rl_runs:/mnt/rl_runs

  determined-agent:
    image: determinedai/determined-agent:0.35.0
    restart: unless-stopped
    depends_on:
      - determined-master
    volumes:
      - ./infra/determined/agent.yaml:/etc/determined/agent.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/rl_runs:/mnt/rl_runs

  rl-platform:
    environment:
      EXECUTOR_MODE: determined
      DETERMINED_MASTER_URL: http://determined-master:8080
      DETERMINED_SHARED_FS_ROOT: /mnt/rl_runs
      LOCAL_RUN_ROOT: /mnt/rl_runs
      DETERMINED_ENTRYPOINT: python -m app.executors.determined_runner
      DETERMINED_IMAGE: rl-portal-backend:local
    volumes:
      - /mnt/rl_runs:/mnt/rl_runs

volumes:
  determined_postgres_data:
