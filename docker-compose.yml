services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rl
      POSTGRES_PASSWORD: rl
      POSTGRES_DB: rl_platform
    ports:
      - "5432:5432"
    volumes:
      - rl_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rl_minio_data:/data

  portal-backend:
    build:
      context: ./apps/portal-backend
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: postgresql+psycopg2://rl:rl@postgres:5432/rl_platform
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rl-artifacts
      ALLOW_ANON: "true"
    ports:
      - "8000:8000"

volumes:
  rl_postgres_data:
  rl_minio_data:
