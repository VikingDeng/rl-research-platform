services:
  # 1. Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rl
      POSTGRES_PASSWORD: rl
      POSTGRES_DB: rl_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rl"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 3. RL Platform (All-in-One)
  rl-platform:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000" # Web UI + API
      - "6006:6006" # TensorBoard
    volumes:
      - ./runs_data:/app/.local # Persist runs/artifacts
    environment:
      # Database
      DATABASE_URL: postgresql+psycopg2://rl:rl@postgres:5432/rl_platform
      DATABASE_STRICT: "1"
      # MinIO Config
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: rl-artifacts
      # Executor Config
      EXECUTOR_MODE: local
      LOCAL_EXECUTOR_MODE: mock
      LOCAL_RUN_ROOT: /app/.local/runs
      # Frontend Hosting
      SERVE_FRONTEND: "true"
      FRONTEND_DIST: /app/dist
      DISABLE_CSP: "1"

volumes:
  postgres_data:
  minio_data:
