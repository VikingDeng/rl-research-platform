openapi: 3.1.0
info:
  title: RL Research Platform API
  version: 1.0.0
  description: |
    Single source of truth for the RL Research Platform API.
    This contract aligns the existing docs with the current frontend data model.
  license:
    name: Proprietary
    identifier: UNLICENSED
servers:
  - url: /api/v1
tags:
  - name: Auth
    description: Authentication
  - name: Settings
    description: System settings and platform metadata
  - name: Projects
    description: Project lifecycle and metadata
  - name: Environments
    description: Environment registry and versions
  - name: Templates
    description: Algorithm templates and versions
  - name: Plugins
    description: Plugin registry and versions
  - name: Runs
    description: Runs, checkpoints, and training submissions
  - name: Jobs
    description: Job lifecycle control
  - name: Eval
    description: Evaluation protocols, pools, and jobs
  - name: Matrix
    description: Matrix jobs and results
  - name: Metrics
    description: Metrics, logs, and streaming
  - name: Artifacts
    description: Artifacts and repro bundles
  - name: Webhooks
    description: Webhook subscriptions
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive an access token
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getAuthMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /settings:
    get:
      tags: [Settings]
      summary: Get system settings summary
      operationId: getSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Settings]
      summary: Update settings
      operationId: patchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /settings/token/rotate:
    post:
      tags: [Settings]
      summary: Rotate API token
      operationId: postSettingsTokenRotate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRotateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /settings/retention/apply:
    post:
      tags: [Settings]
      summary: Apply checkpoint retention policy to all runs
      operationId: postSettingsRetentionApply
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionApplyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: getProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create project
      operationId: postProjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{project_id}:
    get:
      tags: [Projects]
      summary: Get project by ID
      operationId: getProjectsByProjectId
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Update project
      operationId: patchProjectsByProjectId
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      summary: Delete project
      operationId: deleteProjectsByProjectId
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /envs:
    get:
      tags: [Environments]
      summary: List environments
      operationId: getEnvs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvSpec'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /envs/{env_id}/versions:
    get:
      tags: [Environments]
      summary: List environment versions
      operationId: getEnvsByEnvIdVersions
      parameters:
        - $ref: '#/components/parameters/EnvId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/envs:
    post:
      tags: [Environments]
      summary: Register or update environment metadata
      operationId: postAdminEnvs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvVersionUpsert'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/envs/{env_id}:
    patch:
      tags: [Environments]
      summary: Update environment metadata
      operationId: patchAdminEnvs
      parameters:
        - $ref: '#/components/parameters/EnvId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvSpecUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvSpec'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Environments]
      summary: Archive environment
      operationId: deleteAdminEnvs
      parameters:
        - $ref: '#/components/parameters/EnvId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/envs/{env_id}/versions:
    post:
      tags: [Environments]
      summary: Add environment version
      operationId: postAdminEnvsByEnvIdVersions
      parameters:
        - $ref: '#/components/parameters/EnvId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvVersionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/envs/{env_id}/versions/{version}:
    patch:
      tags: [Environments]
      summary: Update environment version
      operationId: patchAdminEnvsByEnvIdVersionsByVersion
      parameters:
        - $ref: '#/components/parameters/EnvId'
        - name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvVersionUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/envs/{env_id}/versions/{version}/freeze:
    post:
      tags: [Environments]
      summary: Freeze environment version
      operationId: postAdminEnvVersionsFreeze
      parameters:
        - $ref: '#/components/parameters/EnvId'
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /algos:
    get:
      tags: [Templates]
      summary: List registered algorithms
      operationId: getAlgos
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Algo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /algos/{algo_id}/versions:
    get:
      tags: [Templates]
      summary: List algorithm versions
      operationId: getAlgoVersions
      parameters:
        - name: algo_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlgoVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/algos:
    post:
      tags: [Templates]
      summary: Register or update algorithm
      operationId: postAdminAlgos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Algo'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Algo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/algos/{algo_id}:
    patch:
      tags: [Templates]
      summary: Update algorithm metadata
      operationId: patchAdminAlgos
      parameters:
        - name: algo_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlgoUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Algo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Templates]
      summary: Archive algorithm
      operationId: deleteAdminAlgos
      parameters:
        - name: algo_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/algos/{algo_id}/versions:
    post:
      tags: [Templates]
      summary: Create algorithm version
      operationId: postAdminAlgoVersions
      parameters:
        - name: algo_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlgoVersionCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgoVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/algos/{algo_id}/versions/{version}:
    patch:
      tags: [Templates]
      summary: Update algorithm version
      operationId: patchAdminAlgoVersions
      parameters:
        - name: algo_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlgoVersionUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgoVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/algos/{algo_id}/versions/{version}/freeze:
    post:
      tags: [Templates]
      summary: Freeze algorithm version
      operationId: postAdminAlgoVersionsFreeze
      parameters:
        - name: algo_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgoVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /templates:
    get:
      tags: [Templates]
      summary: List templates
      operationId: getTemplates
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: projectId
          in: query
          required: false
          schema:
            type: string
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{project_id}/templates:
    post:
      tags: [Templates]
      summary: Create template under project
      operationId: postProjectsByProjectIdTemplates
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /templates/{template_id}:
    get:
      tags: [Templates]
      summary: Get template by ID
      operationId: getTemplatesByTemplateId
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Templates]
      summary: Update template
      operationId: patchTemplatesByTemplateId
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
