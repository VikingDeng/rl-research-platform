components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    EnvId:
      name: env_id
      in: path
      required: true
      schema:
        type: string
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
    CheckpointId:
      name: ckpt_id
      in: path
      required: true
      schema:
        type: string
    ProtocolId:
      name: protocol_id
      in: path
      required: true
      schema:
        type: string
    PoolId:
      name: pool_id
      in: path
      required: true
      schema:
        type: string
    EvalResultId:
      name: eval_result_id
      in: path
      required: true
      schema:
        type: string
    MatrixId:
      name: matrix_id
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
        tokenType:
          type: string
          default: Bearer
        expiresAt:
          type: string
          format: date-time
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
    ExecutorSettings:
      type: object
      required: [mode, localGpuCount]
      properties:
        mode:
          type: string
        localGpuCount:
          type: integer
        determinedMasterUrl:
          type:
            - string
            - 'null'
        determinedConnected:
          type:
            - boolean
            - 'null'
        scheduler:
          type:
            - string
            - 'null'
    StorageUsage:
      type: object
      required: [artifactBytes]
      properties:
        artifactBytes:
          type: integer
        dbBytes:
          type:
            - integer
            - 'null'
    RetentionPolicy:
      type: object
      required: [checkpointPolicy]
      properties:
        checkpointPolicy:
          type: string
    SettingsResponse:
      type: object
      required: [apiToken, executor, storage, retention]
      properties:
        apiToken:
          type: string
        executor:
          $ref: '#/components/schemas/ExecutorSettings'
        storage:
          $ref: '#/components/schemas/StorageUsage'
        retention:
          $ref: '#/components/schemas/RetentionPolicy'
    SettingsUpdate:
      type: object
      properties:
        checkpointPolicy:
          type: string
    TokenRotateResponse:
      type: object
      required: [apiToken]
      properties:
        apiToken:
          type: string
    RetentionApplyResponse:
      type: object
      required: [runsProcessed, checkpointsRemoved, artifactsRemoved]
      properties:
        runsProcessed:
          type: integer
        checkpointsRemoved:
          type: integer
        artifactsRemoved:
          type: integer
    Project:
      type: object
      required: [id, name, tags, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activeRuns:
          type: integer
          minimum: 0
        totalRuns:
          type: integer
          minimum: 0
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
    EnvSpec:
      type: object
      required: [id, versions, maps]
      properties:
        id:
          type: string
